; Batas unggah untuk Arsip Digital (maks. 10 MB per berkas) dan lampiran permohonan (3 × 2 MB).
; Dipasang oleh GitHub Actions ke public_html/core-api/ (folder tempat Laravel dijalankan).
; Berlaku di hosting PHP-FPM/LiteSpeed (mis. Hostinger); perubahan bisa butuh beberapa menit.
; Jika hPanel → PHP Configuration sudah mengatur nilai yang lebih besar, nilai di sana yang dipakai.
upload_max_filesize = 10M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 60
