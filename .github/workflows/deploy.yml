name: Automated Deploy to Hostinger

on:
  push:
    branches:
      - main # Robot bergerak otomatis setiap Anda push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode terbaru dari repositori GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js di server GitHub untuk memproses Vue
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Compile / Build Vue (Frontend) secara otomatis
      - name: Build Vue Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # 4. Mengunggah hasil kompilasi Vue ke folder public_html Hostinger
      - name: Deploy Frontend via SSH/SCP
        uses: appleboy/scp-action@v0.1.7 # 👈 DIUPDATE KE VERSI TERBARU
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "frontend/dist/*"
          target: "domains/sirta.org/public_html"
          strip_components: 2

      # 5. Masuk ke server Hostinger untuk mengupdate Backend Laravel
      - name: Deploy Backend via SSH Command
        uses: appleboy/ssh-action@v1.0.3 # 👈 DIUPDATE KE VERSI TERBARU
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            # Masuk ke folder backend proyek Anda di dalam public_html
            cd domains/sirta.org/public_html/backend
            
            # Daftarkan folder git sebagai safe directory agar tidak diblokir Linux
            git config --global --add safe.directory $(pwd)
            
            # Tarik pembaruan kode Laravel terbaru dari GitHub ke server
            git fetch --all
            git reset --hard origin/main
            
            # Jalankan optimasi internal Laravel otomatis
            /usr/local/bin/php artisan migrate --force
            /usr/local/bin/php artisan config:clear
            /usr/local/bin/php artisan route:clear
            /usr/local/bin/php artisan optimize:clear
