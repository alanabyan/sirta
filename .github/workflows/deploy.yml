name: Automated Deploy to Hostinger

on:
  push:
    branches:
      - main # Robot bergerak otomatis setiap Anda push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode terbaru dari repositori GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js di server GitHub untuk memproses Vue
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Compile / Build Vue (Frontend) secara otomatis
      - name: Build Vue Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # 4. Mengunggah hasil kompilasi Vue ke folder public_html Hostinger
      - name: Deploy Frontend via SSH/SCP
        uses: appleboy/scp-action@v0.1.7 # 👈 DIUPDATE KE VERSI TERBARU
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: 'frontend/dist/*'
          target: 'domains/sirta.org/public_html'
          strip_components:
            2

      # 5. Masuk ke server Hostinger untuk melakukan update otomatis pada Backend Laravel
      - name: Deploy Backend via SSH Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            # 1. Masuk ke folder backend proyek Anda di dalam public_html
            cd domains/sirta.org/public_html/backend

            # 2. Pastikan inisialisasi Git ada di folder ini agar tidak muncul "not a git repository"
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com
            fi

            # 3. Daftarkan folder sebagai safe directory di Linux
            git config --global --add safe.directory $(pwd)

            # 4. Ambil kode terbaru dari GitHub ke server
            git fetch --all
            git reset --hard origin/main

            # 5. Jalankan optimasi Laravel menggunakan jalur asli PHP server Hostinger
            /usr/bin/php artisan migrate --force
            /usr/bin/php artisan config:clear
            /usr/bin/php artisan route:clear
            /usr/bin/php artisan optimize:clear
